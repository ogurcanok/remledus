<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remle Nur Sever - DUS Pro v7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass { background: white; border-radius: 24px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .timer-val { font-variant-numeric: tabular-nums; letter-spacing: -1px; }
        .completed { text-decoration: line-through; opacity: 0.5; }
        .completed-tag { color: #10b981; font-weight: bold; font-size: 9px; margin-left: 5px; }
    </style>
</head>
<body class="p-4 lg:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="glass p-6 mb-8 flex flex-col md:flex-row justify-between items-center bg-white">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 text-white w-12 h-12 flex items-center justify-center rounded-2xl shadow-lg font-black text-xl">R</div>
                <div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight italic">Remle Nur Sever</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-[10px] font-bold text-slate-400">TARİH SEÇ:</span>
                        <input type="date" id="datePicker" onchange="changeDate()" class="bg-blue-50 border-none text-blue-700 text-xs font-bold rounded-lg px-2 py-1 outline-none">
                    </div>
                </div>
            </div>
            <div class="mt-4 md:mt-0 bg-red-50 px-8 py-3 rounded-3xl border border-red-100 text-center">
                <p class="text-[10px] font-black text-red-400 uppercase tracking-[0.2em]">26 Nisan Geri Sayım</p>
                <p id="examDays" class="text-4xl font-black text-red-600">--</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-6">
                <div class="glass p-6 sticky top-10">
                    <h2 class="text-lg font-bold mb-6 text-slate-700 flex justify-between items-center">
                        <span>📋 Genel Müfredat</span>
                        <span class="text-[9px] bg-slate-100 px-3 py-1 rounded-full text-slate-400 font-bold uppercase tracking-widest">Sınava Hazırlık</span>
                    </h2>
                    <div id="mufredatGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[700px] overflow-y-auto pr-2"></div>
                </div>
            </div>

            <div class="lg:col-span-6 space-y-6">
                
                <div class="glass p-8 border-t-8 border-blue-600">
                    <div class="mb-6">
                        <select id="courseSelect" class="w-full bg-slate-50 border-2 border-slate-100 text-sm font-bold p-3 rounded-2xl outline-none text-slate-700">
                            <option value="">ÇALIŞILACAK DERSİ SEÇ...</option>
                        </select>
                    </div>

                    <div id="targetTimer" class="text-7xl font-black text-center text-slate-800 timer-val mb-2">06:00:00</div>
                    <p class="text-center text-[10px] font-bold text-slate-400 tracking-[0.4em] mb-10 uppercase">HEDEFE KALAN</p>
                    
                    <button id="timerBtn" onclick="handleTimer()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all active:scale-95 mb-8">BAŞLAT</button>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 bg-slate-50 rounded-2xl text-center">
                            <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Toplam Çalışılan</p>
                            <p id="doneTime" class="text-xl font-black text-slate-700 timer-val">00:00:00</p>
                        </div>
                        <div class="p-4 bg-blue-50 rounded-2xl text-center">
                            <p class="text-[10px] font-bold text-blue-400 uppercase mb-1">Ders Sayısı</p>
                            <p id="courseCount" class="text-xl font-black text-blue-600">0 Ders</p>
                        </div>
                    </div>
                </div>

                <div class="glass p-6 border-l-8 border-green-500">
                    <h3 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest border-b pb-2">📌 Günün Notları ve Görevleri</h3>
                    
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="noteInput" placeholder="Yeni not veya görev ekle..." class="flex-1 bg-slate-100 border-none p-3 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-green-200">
                        <button onclick="addNote()" class="bg-green-500 text-white px-5 rounded-xl font-black hover:bg-green-600 transition">+</button>
                    </div>

                    <div id="notesContainer" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                        </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-6">
                        <h3 class="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest">📊 Ders Özeti</h3>
                        <div id="courseSummary" class="space-y-1"></div>
                    </div>
                    <div class="glass p-6">
                        <h3 class="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest">🕒 Son Oturumlar</h3>
                        <div id="sessionLog" class="space-y-1 max-h-40 overflow-y-auto"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const DERSLER = ["Anatomi", "Biyokimya", "Mikrobiyoloji", "Farmakoloji", "Patoloji", "Fizyoloji", "Ortodonti", "Pedodonti", "Periyodontoloji", "Restoratif Diş", "Protez", "Cerrahi", "Radyo", "Endodonti", "Tarih"];
        const TARGET_MS = 6 * 60 * 60 * 1000;
        const EXAM_DATE = new Date('2026-04-26');

        let isRunning = false;
        let timerIdx;
        let sessionStartTimeMs;
        let currentDayKey = new Date().toLocaleDateString('tr-TR');

        let db = JSON.parse(localStorage.getItem('remle_v7')) || { muf: {}, logs: {} };

        function init() {
            document.getElementById('datePicker').valueAsDate = new Date();
            if(!db.logs[currentDayKey]) db.logs[currentDayKey] = { time: 0, notes: [], sessions: [] };
            
            const select = document.getElementById('courseSelect');
            DERSLER.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
            
            renderMuf();
            updateDisplay();

            // Enter ile not ekleme
            document.getElementById('noteInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') addNote();
            });
        }

        function changeDate() {
            const picker = document.getElementById('datePicker').value;
            currentDayKey = new Date(picker).toLocaleDateString('tr-TR');
            if(!db.logs[currentDayKey]) db.logs[currentDayKey] = { time: 0, notes: [], sessions: [] };
            updateDisplay();
        }

        function updateDisplay() {
            const selectedDateObj = new Date(document.getElementById('datePicker').value);
            const diff = EXAM_DATE - selectedDateObj;
            document.getElementById('examDays').innerText = Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));

            const log = db.logs[currentDayKey];
            log.time = log.sessions.reduce((acc, s) => acc + s.duration, 0);
            
            const done = log.time;
            const rem = Math.max(0, TARGET_MS - done);
            document.getElementById('targetTimer').innerText = msToTime(rem);
            document.getElementById('doneTime').innerText = msToTime(done);
            
            renderNotes();
            renderSessions();
            renderCourseSummary();
        }

        function addNote() {
            const input = document.getElementById('noteInput');
            if(!input.value.trim()) return;
            
            db.logs[currentDayKey].notes.push({
                id: Date.now(),
                text: input.value,
                done: false
            });
            input.value = '';
            save();
            renderNotes();
        }

        function toggleNote(id) {
            const note = db.logs[currentDayKey].notes.find(n => n.id === id);
            if(note) note.done = !note.done;
            save();
            renderNotes();
        }

        function deleteNote(id) {
            db.logs[currentDayKey].notes = db.logs[currentDayKey].notes.filter(n => n.id !== id);
            save();
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';
            const notes = db.logs[currentDayKey].notes || [];
            
            notes.forEach(n => {
                container.innerHTML += `
                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100 group">
                    <input type="checkbox" onchange="toggleNote(${n.id})" ${n.done?'checked':''} class="w-4 h-4 accent-green-500">
                    <span class="flex-1 text-xs font-semibold ${n.done?'completed text-slate-400':''}">
                        ${n.text} ${n.done ? '<span class="completed-tag">✓ TAMAMLANDI</span>' : ''}
                    </span>
                    <button onclick="deleteNote(${n.id})" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all font-bold">×</button>
                </div>`;
            });
            if(notes.length === 0) container.innerHTML = '<p class="text-[10px] text-slate-300 italic text-center py-4">Not veya görev eklenmemiş.</p>';
        }

        function handleTimer() {
            const course = document.getElementById('courseSelect').value;
            const todayKey = new Date().toLocaleDateString('tr-TR');

            if(currentDayKey !== todayKey) { alert("Sadece bugüne canlı kayıt yapabilirsin!"); return; }
            if(!course && !isRunning) { alert("Lütfen önce bir ders seç!"); return; }

            if(!isRunning) {
                isRunning = true;
                sessionStartTimeMs = Date.now();
                document.getElementById('timerBtn').innerText = "DURDUR";
                document.getElementById('timerBtn').style.background = "#ef4444";
                
                let lastTick = Date.now();
                timerIdx = setInterval(() => {
                    const now = Date.now();
                    const delta = now - lastTick;
                    db.logs[currentDayKey].time += delta;
                    lastTick = now;
                    document.getElementById('targetTimer').innerText = msToTime(Math.max(0, TARGET_MS - db.logs[currentDayKey].time));
                    document.getElementById('doneTime').innerText = msToTime(db.logs[currentDayKey].time);
                }, 1000);
            } else {
                isRunning = false;
                clearInterval(timerIdx);
                const duration = Date.now() - sessionStartTimeMs;
                if(duration > 1000) {
                    db.logs[currentDayKey].sessions.push({
                        id: Date.now(),
                        start: new Date(sessionStartTimeMs).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}),
                        end: new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}),
                        course: document.getElementById('courseSelect').value,
                        duration: duration
                    });
                }
                document.getElementById('timerBtn').innerText = "BAŞLAT";
                document.getElementById('timerBtn').style.background = "#2563eb";
                save();
                updateDisplay();
            }
        }

        function renderCourseSummary() {
            const div = document.getElementById('courseSummary');
            div.innerHTML = '';
            const summary = {};
            (db.logs[currentDayKey].sessions || []).forEach(s => summary[s.course] = (summary[s.course] || 0) + s.duration);
            const items = Object.entries(summary).sort((a,b) => b[1]-a[1]);
            items.forEach(([n, t]) => div.innerHTML += `<div class="flex justify-between text-[10px] bg-blue-50 p-1.5 rounded-lg mb-1"><span class="font-bold">${n}</span><span>${msToTime(t)}</span></div>`);
            document.getElementById('courseCount').innerText = items.length + " Ders";
        }

        function renderSessions() {
            const div = document.getElementById('sessionLog');
            div.innerHTML = '';
            (db.logs[currentDayKey].sessions || []).slice().reverse().forEach(s => {
                div.innerHTML += `<div class="text-[9px] flex justify-between p-1 border-b"><span>${s.start}-${s.end} | ${s.course}</span><button onclick="deleteSession(${s.id})" class="text-red-400">×</button></div>`;
            });
        }

        function deleteSession(id) {
            db.logs[currentDayKey].sessions = db.logs[currentDayKey].sessions.filter(s => s.id !== id);
            save(); updateDisplay();
        }

        function renderMuf() {
            const grid = document.getElementById('mufredatGrid');
            grid.innerHTML = '';
            DERSLER.forEach(d => {
                const k = d+'_k', s = d+'_s';
                grid.innerHTML += `<div class="p-3 bg-white border border-slate-100 rounded-2xl flex justify-between items-center shadow-sm"><span class="text-[11px] font-bold text-slate-600">${d}</span><div class="flex gap-2"><input type="checkbox" onchange="toggleMuf('${k}')" ${db.muf[k]?'checked':''} class="w-4 h-4 accent-blue-600"><input type="checkbox" onchange="toggleMuf('${s}')" ${db.muf[s]?'checked':''} class="w-4 h-4 accent-green-500"></div></div>`;
            });
        }

        function msToTime(ms) {
            let s = Math.floor(ms / 1000); let m = Math.floor(s / 60); let h = Math.floor(m / 60);
            return `${h.toString().padStart(2,'0')}:${(m%60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
        }
        function toggleMuf(k) { db.muf[k] = !db.muf[k]; save(); }
        function save() { localStorage.setItem('remle_v7', JSON.stringify(db)); }
        init();
    </script>
</body>
</html>
